<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Драфт-помощник Dota 2</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#101217">
<style>
:root{--bg:#0d0f13;--panel:#161920;--panel2:#1d212a;--line:#2a2f3a;--text:#e6e8ec;--muted:#8d94a3;--ours:#5ccf7a;--enemy:#ef5f52;--ban:#9aa0ac;--gold:#e0b04f;--good:#5ccf7a;--bad:#ef6b5f;--tag:#7fa7ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button:hover{border-color:#3d4452}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:#11141a;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;color:var(--gold);margin-right:6px}
.status{color:var(--muted);font-size:12px;flex:1;min-width:200px}
.status b{color:var(--text);font-weight:500}
.status .warn{color:var(--bad)}
#settings{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 22px}
#settings[hidden]{display:none}
#settings label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px}
#settings .row{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:13px}
#settings input[type=number],#settings input[type=text],#settings select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.set-tags{display:flex;flex-direction:column;gap:4px}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
h2{margin:0 0 10px;font-size:15px}
h3{margin:14px 0 8px;font-size:13px;color:var(--muted);font-weight:600;text-transform:none}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.teams{grid-template-columns:1fr}}
.team.ours h2{color:var(--ours)} .team.enemy h2{color:var(--enemy)}
.slot{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;background:var(--panel2);margin-bottom:6px;min-height:46px}
.slot.empty{color:var(--muted);font-size:12px;justify-content:center;border:1px dashed var(--line);background:transparent}
.slot .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{display:flex;gap:3px}
.pos button{padding:2px 0;width:24px;font-size:12px;border-radius:5px;background:#12151b}
.pos button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.x{padding:2px 8px;background:transparent;border-color:transparent;color:var(--muted)}
.x:hover{color:var(--bad)}
.pic{position:relative;width:52px;height:30px;border-radius:5px;overflow:hidden;flex:none;background:#2a2f3a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#c9ced8}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bans{margin-top:12px}
.banlist{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.banchip{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:6px;padding:3px 4px 3px 3px;font-size:12px}
.banchip .pic{width:40px;height:23px;filter:grayscale(1)}
.picker{margin-top:14px}
.modes{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.modes button.on[data-mode=ours]{background:var(--ours);border-color:var(--ours);color:#06210f;font-weight:700}
.modes button.on[data-mode=enemy]{background:var(--enemy);border-color:var(--enemy);color:#2a0805;font-weight:700}
.modes button.on[data-mode=ban]{background:var(--ban);border-color:var(--ban);color:#15171b;font-weight:700}
#search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px}
#search:focus{outline:2px solid var(--gold);outline-offset:-1px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 8px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:430px;overflow:auto;padding-right:2px}
.tile{display:flex;flex-direction:column;align-items:stretch;padding:4px;border-radius:7px;background:var(--panel2);border:1px solid transparent;text-align:left;gap:3px}
.tile:hover{border-color:var(--gold)}
.tile .pic{width:100%;height:46px}
.tile .tn{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tw{font-size:11px}
.tile.off{opacity:.25;pointer-events:none}
.tile.first{border-color:var(--gold)}
.good{color:var(--good)} .bad{color:var(--bad)}
#notes .note{font-size:12px;color:var(--muted);background:var(--panel2);border-left:3px solid var(--gold);padding:7px 10px;margin-bottom:8px;border-radius:0}
.openpos{font-size:13px;margin-bottom:6px}
.openpos b{color:var(--gold)}
.rec{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:9px;background:var(--panel2);margin-bottom:6px;border:1px solid transparent;cursor:pointer;width:100%;text-align:left}
.rec:hover{border-color:var(--ours)}
.rec .pic{width:64px;height:36px}
.rec .body{flex:1;min-width:0}
.rec .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rec .rn{font-weight:600;font-size:14px}
.rec .rp{font-size:11px;color:var(--muted)}
.rec .sc{margin-left:auto;font-weight:700;color:var(--gold);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;background:#12151b;border:1px solid var(--line);color:var(--muted)}
.chip.good{color:var(--good);border-color:#2c5a39}
.chip.bad{color:var(--bad);border-color:#5e2d29}
.chip.tag{color:var(--tag);border-color:#2c3c66}
.tier{display:inline-block;min-width:18px;text-align:center;font-size:11px;font-weight:800;padding:0 5px;border-radius:4px;margin-right:2px}
.tier.tS{background:#e8566c;color:#fff}.tier.tA{background:#f2a65e;color:#2a1405}.tier.tB{background:#f2dc5d;color:#2a2405}.tier.tC{background:#b8e07a;color:#18250a}.tier.tD{background:#68c08a;color:#0a2514}
.slot .sub{font-size:11px;color:var(--muted);font-weight:400}
.an h3{margin-top:4px}
.an-row{margin-bottom:12px}
.an-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:13px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:12px;font-weight:700}
.bar .bo{background:#2f7a45;color:#eafff0;display:flex;align-items:center;padding-left:8px;white-space:nowrap}
.bar .be{background:#8a2f2a;color:#ffecea;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;white-space:nowrap}
.an-sub{margin-top:4px}.an-sub .vs{color:var(--gold)}
.an-note{margin-top:8px}
.pairpos{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.pairpos button{font-size:11px;padding:2px 8px;border-radius:999px;background:#12151b}
.pairpos button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.rec.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.rec.pair .pp{display:flex;gap:8px;align-items:center;min-width:0}
.rec.pair .pc{min-width:0;font-size:13px}
.rec.pair .plus{color:var(--gold);font-weight:800}
.rec.pair .psc{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.likely{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:4px}
.likely .lk{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:5px;font-size:12.5px;border:1px solid #4a2a28}
.likely .pic{width:48px;height:28px}
.comp{background:var(--panel2);border-radius:9px;padding:8px 10px}
.comp .cr{display:grid;grid-template-columns:1fr 70px 70px;gap:8px;align-items:center;font-size:12px;padding:2px 0}
.comp .ch{color:var(--muted);font-size:11px}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2a2f3a;margin-right:3px}
.dots i.o{background:var(--ours)}.dots i.e{background:var(--enemy)}.dots i.half{opacity:.45}
.chint{font-size:12px;padding:6px 9px;margin-top:6px;background:var(--panel2);border-radius:0}
.chint.bad{border-left:3px solid var(--enemy)}.chint.tag{border-left:3px solid var(--tag)}
#compCard{margin-top:12px}
#compCard h3{margin-top:0}
details.notes{margin-bottom:8px}
details.notes summary{cursor:pointer;color:var(--muted);font-size:12px;margin-bottom:6px}
.rec.threat{cursor:default;border-color:#4a2a28}
.rec.threat:hover{border-color:#4a2a28}
.chip.hard{color:#1a1405;background:var(--gold);border-color:var(--gold);font-weight:700}
.empty-recs{color:var(--muted);font-size:13px;padding:6px 0}
.err{color:var(--bad);padding:20px;text-align:center}
.small{font-size:12px;color:var(--muted)}
@media (max-width:620px){header{position:static}}
</style>
</head>
<body>
<header>
  <div class="brand">Драфт-помощник</div>
  <div class="status" id="status">Загрузка данных…</div>
  <button id="btnNew" title="Очистить пики и баны">Новый драфт</button>
  <button id="btnRefresh" title="Скачать свежую статистику">Обновить данные</button>
  <button id="btnSettings">Настройки</button>
</header>

<section id="settings" hidden>
  <label>Ранг (статистика берётся по нему)
    <select id="setRank"></select>
  </label>
  <label>Минимум игр для пары героев
    <input type="number" id="setMinGames" min="10" step="10">
  </label>
  <label>Минимум игр для «опасных пиков врага» (контрпиков наших)
    <input type="number" id="setThreatMin" min="50" step="50">
  </label>
  <div class="set-tags">
    <label class="row"><input type="checkbox" id="setHard"> Жёсткие контрпики даже с WR ниже 50%</label>
    <label>Порог «жёсткого» контрпика: WR против врага, %
      <input type="number" id="setHardWr" min="50" max="70" step="0.5">
    </label>
  </div>
  <div class="set-tags">
    <span class="small">Ценить героев с:</span>
    <label class="row"><input type="checkbox" data-tag="p"> уроном по башням (коры и саппорты)</label>
    <label class="row"><input type="checkbox" data-tag="g"> глобальными скиллами</label>
    <label class="row"><input type="checkbox" data-tag="r"> быстрым Рошаном (только керри и мид)</label>
    <label class="row"><input type="checkbox" data-tag="l"> сильной линией</label>
  </div>
  <div class="set-tags">
    <label class="row"><input type="checkbox" id="setOffrole"> Предлагать героев не на их обычных позициях</label>
    <label>Советов на каждую позицию
      <input type="number" id="setPerPos" min="1" max="8">
    </label>
  </div>
  <label>Период статистики (нужен STRATZ)
    <select id="setPeriod">
      <option value="patch">С начала патча</option>
      <option value="1">Последний день</option>
      <option value="3">3 дня</option>
      <option value="7">7 дней</option>
      <option value="14">14 дней</option>
      <option value="30">30 дней</option>
    </select>
  </label>
  <label>Дата выхода патча (для «С начала патча»)
    <input type="date" id="setPatchDate">
  </label>
  <label>Где лежат данные STRATZ (папка или ссылка)
    <input type="text" id="setDataUrl" placeholder="data">
  </label>
</section>

<main>
  <div>
    <div class="card">
      <div class="teams">
        <div class="team ours"><h2>Наша команда</h2><div id="oursSlots"></div></div>
        <div class="team enemy"><h2>Враги</h2><div id="enemySlots"></div></div>
      </div>
      <div class="bans"><h3>Баны</h3><div class="banlist" id="banList"></div></div>
    </div>
    <div class="card" id="compCard" hidden></div>
    <div class="card picker">
      <div class="modes" id="modes">
        <button data-mode="ours">Добавить нам</button>
        <button data-mode="enemy">Добавить врагам</button>
        <button data-mode="ban">Забанить</button>
      </div>
      <input id="search" autocomplete="off" placeholder="Поиск: пудж, am, сф, инвок…">
      <div class="hint">Enter — добавить первого героя из списка. Позицию можно поменять кнопками 1–5 у героя.</div>
      <div id="grid"></div>
    </div>
  </div>
  <aside class="card">
    <h2>Кого пикать</h2>
    <div id="notes"></div>
    <div id="recs"><div class="empty-recs">Загрузка…</div></div>
  </aside>
</main>

<script>

const OPENDOTA = "https://api.opendota.com/api/heroStats";
const IMG_HOST = "https://cdn.cloudflare.steamstatic.com";
const RANKS = [["all","Все ранги"],["1","Рекрут"],["2","Страж"],["3","Рыцарь"],["4","Герой"],["5","Легенда"],["6","Властелин"],["7","Божество"],["8","Титан"],["pro","Про-сцена"]];
const STRATZ_BRACKET = {all:"ALL","1":"HERALD_GUARDIAN","2":"HERALD_GUARDIAN","3":"CRUSADER_ARCHON","4":"CRUSADER_ARCHON","5":"LEGEND_ANCIENT","6":"LEGEND_ANCIENT","7":"DIVINE_IMMORTAL","8":"DIVINE_IMMORTAL",pro:"ALL"};
const STRATZ_LABEL = {ALL:"все ранги",HERALD_GUARDIAN:"Рекрут–Страж",CRUSADER_ARCHON:"Рыцарь–Герой",LEGEND_ANCIENT:"Легенда–Властелин",DIVINE_IMMORTAL:"Божество–Титан"};
const POS_NAME = {1:"Керри",2:"Мид",3:"Оффлейн",4:"Семи-саппорт",5:"Фулл-саппорт"};
const TAG_NAME = {p:"урон по башням",g:"глобалка",r:"быстрый Рошан",l:"сильная линия"};
const DEFAULTS = {rank:"7",minGames:150,hard:true,hardWr:55,tags:{p:true,g:true,r:true,l:true},offrole:false,perPos:5,threatMin:1000,dataUrl:"data",period:"patch",patchDate:"2026-11-19"};

const LS = {
  get(k,d){try{const v=localStorage.getItem("dd_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("dd_"+k,JSON.stringify(v))}catch(e){}}
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().replace(/ё/g,"е").replace(/[\s\-'’_.]/g,"");
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const fmt = n => n.toLocaleString("ru-RU");

const INFO = {};
for (const line of HERO_TABLE.trim().split("\n")){
  const [k,pos,tags,al] = line.split("|");
  INFO[k] = {pos:pos.split("").map(Number),tags:tags||"",al:(al||"").split(",").filter(Boolean)};
}

let settings = Object.assign({}, DEFAULTS, LS.get("settings2",{}));
settings.tags = Object.assign({}, DEFAULTS.tags, settings.tags||{});
// переход на новые значения по умолчанию у тех, у кого уже сохранены старые настройки
if ((settings.v||1) < 2){ settings.threatMin = 1000; settings.v = 2; }
let state = Object.assign({ours:[],enemy:[],bans:[],mode:"ours",pairPos:"any"}, LS.get("draft",{}));
let H = {}, LIST = [], heroStatsMeta = null, SZ = null, SP = null, SD = null, PST = null, LN = null, TD = null, SZKEY = null;
const szCache = {};

function save(){ LS.set("draft",state); LS.set("settings2",settings); }

function posFromRoles(roles){
  const r = roles||[], out = [];
  if (r.includes("Carry")) out.push(1);
  if (r.includes("Nuker")||r.includes("Escape")) out.push(2);
  if (r.includes("Initiator")||r.includes("Durable")) out.push(3);
  if (r.includes("Support")) out.push(4,5);
  const u = [...new Set(out)];
  return u.length ? u : [1,2,3,4,5];
}

function applyPositions(){
  for (const h of LIST){
    h.posAuto = null;
    const arr = SP && SP.heroes && SP.heroes[h.id];
    if (!arr) continue;
    const tot = arr.reduce((s,x)=>s+(x?x[0]:0),0);
    if (tot < 200) continue;
    const ps = [1,2,3,4,5].filter(p=>arr[p-1] && arr[p-1][0]/tot >= 0.10).sort((a,b)=>arr[b-1][0]-arr[a-1][0]);
    if (ps.length) h.posAuto = ps;
  }
}
const posOf = h => h.posAuto || h.pos;

function buildHeroes(data){
  H = {}; LIST = [];
  for (const d of data){
    if (!d || !d.id) continue;
    const short = String(d.name||"").replace("npc_dota_hero_","");
    const info = INFO[short];
    const name = d.localized_name || short;
    const h = {id:d.id,name,short,img:d.img?IMG_HOST+d.img:"",pos:info?info.pos:posFromRoles(d.roles),tags:info?info.tags:"",raw:d,known:!!info};
    h.keys = [name, short, ...(info?info.al:[])].map(norm);
    h.initials = name.split(/[\s-]+/).map(w=>w[0]).join("").slice(0,3).toUpperCase();
    H[d.id] = h; LIST.push(h);
  }
  LIST.sort((a,b)=>a.name.localeCompare(b.name));
}

function rawStat(h){
  if (PST){ const x = PST.all[h.id] || [0,0]; return {p:x[0],w:x[1],wr:x[0]?x[1]/x[0]*100:0}; }
  const d = h.raw, r = settings.rank;
  let p = 0, w = 0;
  const add = i => { p += d[i+"_pick"]||0; w += d[i+"_win"]||0; };
  if (r === "all") for (let i=1;i<=8;i++) add(i);
  else if (r === "pro") { p = d.pro_pick||0; w = d.pro_win||0; }
  else if (r === "8") { add(7); add(8); }
  else add(r);
  return {p,w,wr:p?w/p*100:0};
}

function pair(a,b,kind){
  if (!SZ || !SZ.heroes) return null;
  const A = SZ.heroes[a]; let x = A && A[kind] && A[kind][b];
  if (x && x[0]) return {m:x[0],wr:x[1]/x[0]*100};
  const B = SZ.heroes[b]; x = B && B[kind] && B[kind][a];
  if (x && x[0]) return {m:x[0],wr:kind==="v"?100-x[1]/x[0]*100:x[1]/x[0]*100};
  return null;
}

function pic(h, cls){
  const img = h.img ? `<img src="${esc(h.img)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  return `<div class="pic ${cls||""}">${esc(h.initials)}${img}</div>`;
}

function unavailable(){
  return new Set([...state.ours.map(x=>x.id),...state.enemy.map(x=>x.id),...state.bans]);
}

function autoPos(h, team){
  if (team === "enemy") return null; // позицию врага знаем только приблизительно — считаем по вероятностям
  const used = new Set(state[team].map(x=>x.pos).filter(Boolean));
  for (const p of posOf(h)) if (!used.has(p)) return p;
  if (team === "enemy") return null;
  for (let p=1;p<=5;p++) if (!used.has(p)) return p;
  return null;
}

function addHero(id, team, pos){
  const h = H[id]; if (!h) return;
  if (unavailable().has(id)) return;
  if (team === "ban") { state.bans.push(id); }
  else {
    if (state[team].length >= 5) { flashSearch(team==="ours"?"В нашей команде уже 5 героев":"У врагов уже 5 героев"); return; }
    const p = pos || autoPos(h, team);
    if (p) for (const x of state[team]) if (x.pos === p) x.pos = null;
    state[team].push({id, pos:p||null});
  }
  save(); renderAll();
}

function removeHero(team, idx){
  if (team === "ban") state.bans.splice(idx,1); else state[team].splice(idx,1);
  save(); renderAll();
}

function setPos(team, idx, p){
  const list = state[team], cur = list[idx];
  if (cur.pos === p) { cur.pos = null; }
  else {
    const other = list.find((x,i)=>i!==idx && x.pos===p);
    if (other) other.pos = cur.pos;
    cur.pos = p;
  }
  save(); renderAll();
}

function flashSearch(msg){
  const el = $("#search"); el.value = ""; el.placeholder = msg;
  setTimeout(()=>{el.placeholder="Поиск: пудж, am, сф, инвок…"},2500);
}

/* ---------- рендер ---------- */

function renderBans(){
  $("#banList").innerHTML = state.bans.length
    ? state.bans.map((id,i)=>H[id]?`<div class="banchip">${pic(H[id])}${esc(H[id].name)}<button class="x" data-act="rm" data-team="ban" data-i="${i}">✕</button></div>`:"").join("")
    : `<span class="small">Пока никого</span>`;
}

function renderModes(){
  const n = {ours:state.ours.length,enemy:state.enemy.length,ban:state.bans.length};
  const label = {ours:`Добавить нам (${n.ours}/5)`,enemy:`Добавить врагам (${n.enemy}/5)`,ban:`Забанить (${n.ban})`};
  document.querySelectorAll("#modes button").forEach(b=>{b.classList.toggle("on",b.dataset.mode===state.mode);b.textContent=label[b.dataset.mode];});
}

function filtered(){
  const q = norm($("#search").value);
  if (!q) return LIST;
  const starts = [], inc = [];
  for (const h of LIST){
    if (h.keys.some(k=>k.startsWith(q))) starts.push(h);
    else if (h.keys.some(k=>k.includes(q))) inc.push(h);
  }
  return starts.concat(inc);
}

function renderGrid(){
  const un = unavailable(), list = filtered(), ctx = context();
  let firstMarked = false, html = "";
  for (const h of list){
    const st = rawStat(h), off = un.has(h.id);
    let cls = "tile" + (off?" off":"");
    if (!off && !firstMarked && $("#search").value.trim()) { cls += " first"; firstMarked = true; }
    const wr = st.p ? `<span class="${st.wr>=50?"good":"bad"}">${st.wr.toFixed(1)}%</span>` : `<span class="small">нет данных</span>`;
    html += `<button class="${cls}" data-act="add" data-id="${h.id}" title="${esc(h.name)} — позиции ${posOf(h).join(", ")}. Здесь общий винрейт героя на всех позициях; в советах — винрейт на конкретной позиции.">${pic(h)}<span class="tn">${esc(h.name)}</span><span class="tw">${tierBadge(ctx.tier0[h.id])} ${wr}</span></button>`;
  }
  $("#grid").innerHTML = html || `<div class="small">Никого не нашёл</div>`;
}

function context(){
  const st = {}; let total = 0, cnt = 0;
  for (const h of LIST){ const s = rawStat(h); st[h.id] = s; total += s.p; if (s.p > 0) cnt++; }
  const mean = cnt ? total/cnt : 1;
  const posMean = {};
  const sp = !!(SP && SP.heroes);
  if (sp) for (let p=1;p<=5;p++){
    let t = 0, c = 0;
    for (const h of LIST){ const x = SP.heroes[h.id] && SP.heroes[h.id][p-1]; if (x && x[0] > 0){ t += x[0]; c++; } }
    posMean[p] = c ? t/c : 1;
  }
  const has = {p:0,g:0,r:0,l:0};
  for (const o of state.ours){
    const h = H[o.id]; if (!h) continue;
    for (const t of h.tags){ if (t === "r" && o.pos !== 1 && o.pos !== 2) continue; has[t]++; }
  }
  const ctx = {st,total,mean,posMean,has,sz:!!(SZ&&SZ.heroes),sp,enemyP:teamProbs("enemy"),ourComp:teamComp("ours"),likely:[]};
  const all = [];
  for (const h of LIST){ const m = metaFor(h,0,ctx); if (m) all.push({id:h.id,pts:m.pts}); }
  ctx.tier0 = tierMap(all);
  return ctx;
}

// Мета-рейтинг героя (как тир на d2pt): винрейт + популярность.
// p = 0 — общий по герою, p = 1..5 — на конкретной позиции (если есть данные STRATZ по позициям).
function metaFor(h, p, ctx){
  if (p && ctx.sp){
    // Есть статистика по позициям — используем ТОЛЬКО её. Если на этой позиции у героя мало игр,
    // героя на неё не предлагаем (общий винрейт героя на позицию не подставляется никогда).
    const x = SP.heroes[h.id] && SP.heroes[h.id][p-1];
    if (!x || x[0] < settings.minGames) return null;
    const wr = x[1]/x[0]*100, rel = x[0]/ctx.posMean[p];
    return {wr, m:x[0], pts:(wr-50) + 1.5*clamp(Math.log2(rel),-2,2), positional:true};
  }
  const st = ctx.st[h.id];
  if (!st || st.p < 30) return null;
  const rel = st.p/ctx.mean;
  return {wr:st.wr, m:st.p, pts:(st.wr-50) + 1.5*clamp(Math.log2(rel),-2,2), positional:false};
}

function tierMap(entries){
  const s = entries.slice().sort((a,b)=>b.pts-a.pts), n = s.length || 1, out = {};
  s.forEach((e,i)=>{ const q = i/n; out[e.id] = q<0.06?"S":q<0.20?"A":q<0.45?"B":q<0.70?"C":"D"; });
  return out;
}
const tierBadge = t => t ? `<span class="tier t${t}" title="Тир по мете">${t}</span>` : "";

function score(h, p, ctx, tier){
  const mt = metaFor(h,p,ctx);
  if (!mt) return null;
  const wr = mt.wr, base = ctx.st[h.id] ? ctx.st[h.id].wr : wr;
  let pts = mt.pts;
  const why = [], hard = [];
  why.push({t:mt.positional ? `WR ${wr.toFixed(1)}% на поз. ${p}` : `WR ${wr.toFixed(1)}% (общий, без разбивки по позициям)`,k:wr>=50?"good":"bad"});
  why.push({t:`${fmt(mt.m)} игр`,k:""});
  if (ctx.sz){
    state.enemy.forEach((e,k)=>{
      const pr = pair(h.id,e.id,"v"); if (!pr || pr.m < settings.minGames) return;
      const d = pr.wr - base, w = p===2 ? 1 + 0.5*ctx.enemyP[k][1] : 1;
      pts += d*w*0.8;
      const en = H[e.id] ? H[e.id].name : "?";
      if (pr.wr >= settings.hardWr) hard.push({n:en,wr:pr.wr,m:pr.m});
      else if (d >= 1.5) why.push({t:`контрит ${en}: ${pr.wr.toFixed(1)}% (${fmt(pr.m)} игр)`,k:"good"});
      else if (d <= -1.5) why.push({t:`слаб против ${en}: ${pr.wr.toFixed(1)}%`,k:"bad"});
    });
    for (const a of state.ours){
      const pr = pair(h.id,a.id,"w"); if (!pr || pr.m < settings.minGames) continue;
      const d = pr.wr - base; pts += d*1.0;
      const an = H[a.id] ? H[a.id].name : "?";
      if (d >= 1.5) why.push({t:`синергия с ${an}: ${pr.wr.toFixed(1)}% (${fmt(pr.m)} игр)`,k:"good"});
      else if (d <= -1.5) why.push({t:`плохо вместе с ${an}: ${pr.wr.toFixed(1)}%`,k:"bad"});
    }
  }
  const T = settings.tags;
  if (T.p && h.tags.includes("p")){ const n = ctx.has.p; pts += n===0?1.5:n===1?0.6:0.2; why.push({t:TAG_NAME.p,k:"tag"}); }
  if (T.g && h.tags.includes("g")){ pts += ctx.has.g===0?0.8:0.3; why.push({t:TAG_NAME.g,k:"tag"}); }
  if (T.r && h.tags.includes("r") && (p === 1 || p === 2)){ pts += ctx.has.r===0?1.0:0.3; why.push({t:TAG_NAME.r,k:"tag"}); }
  if (T.l && h.tags.includes("l")){ pts += 0.6; why.push({t:TAG_NAME.l,k:"tag"}); }
  if (ctx.sz && ctx.likely.length && state.enemy.length < 5){
    let sw = 0, sv = 0; const good = [], badL = [];
    for (const x of ctx.likely){
      if (x.h.id === h.id) continue;
      const pr = pair(h.id,x.h.id,"v"); if (!pr || pr.m < settings.minGames) continue;
      const d = pr.wr - base; sw += x.w; sv += x.w*d;
      if (d >= 2) good.push(x.h.name); else if (d <= -2) badL.push(x.h.name);
    }
    if (sw > 0){
      const f = sv/sw; pts += f*1.2*Math.min(1,(5-state.enemy.length)/3);
      if (f >= 1) why.push({t:`хорош против вероятных пиков врага${good.length?": "+good.slice(0,2).join(", "):""}`,k:"good"});
      else if (f <= -1) why.push({t:`рискованно против вероятных пиков врага${badL.length?": "+badL.slice(0,2).join(", "):""}`,k:"bad"});
    }
  }
  if (state.ours.length >= 2 && ctx.ourComp.ctrl < 1.5 && roles(h).includes("Disabler")){ pts += 0.4; why.push({t:"контроль (у нас его мало)",k:"tag"}); }
  if (posOf(h)[0] === p) pts += 0.5;
  const ok = wr >= 50 || (settings.hard && hard.length > 0);
  if (!ok) return null;
  return {h,p,pts,wr,why,hard,tier};
}

function recCard(r){
  const h = r.h;
  const chips = [];
  for (const x of r.hard) chips.push(`<span class="chip hard">жёсткий контрпик ${esc(x.n)}: ${x.wr.toFixed(1)}% (${fmt(x.m)} игр)</span>`);
  for (const w of r.why) chips.push(`<span class="chip ${w.k}">${esc(w.t)}</span>`);
  return `<button class="rec" data-act="pick" data-id="${h.id}" data-p="${r.p}" title="Нажми, чтобы взять этого героя">${pic(h)}<div class="body"><div class="top">${tierBadge(r.tier)}<span class="rn">${esc(h.name)}</span><span class="rp">поз. ${r.p} · ${POS_NAME[r.p]}</span><span class="sc">${r.pts>=0?"+":""}${r.pts.toFixed(1)}</span></div><div class="chips">${chips.join("")}</div></div></button>`;
}

function renderRecs(){
  const notes = [];
  if (!LIST.length){ $("#recs").innerHTML = ""; return; }
  const ctx = context();
  const rankName = RANKS.find(r=>r[0]===settings.rank)[1];
  notes.push(`Мета по рангу «${rankName}». Тир S/A/B/C/D — как на d2pt: винрейт плюс популярность.`);
  if (PST){
    const f = d => new Date(d*1000).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",timeZone:"UTC"});
    if (PST.fallback) notes.push(`За выбранный период у STRATZ ещё нет данных — пока показываю последние ${PST.n} дн. (${f(PST.from)}–${f(PST.to)}).`);
    else notes.push(`Статистика STRATZ за ${PST.n} дн. (${f(PST.from)}–${f(PST.to)}).` + (PST.n <= 2 ? " Дней мало — цифры пока шумные." : ""));
  } else if (SD) notes.push("За выбранный период у STRATZ пока нет данных — показываю OpenDota.");
  else notes.push("Мета пока от OpenDota за её стандартный период (может включать старый патч). Выбор периода заработает после подключения STRATZ.");
  if (ctx.sp) notes.push("Винрейт по позициям: STRATZ. Позиции героев тоже берутся из реальных игр.");
  else notes.push("Пока винрейт общий по герою, без разделения по позициям. По позициям появится после подключения STRATZ.");
  if (!ctx.sz) notes.push("Контрпики и синергия пока выключены: нет данных STRATZ.");
  else notes.push(`Пары героев: STRATZ (${STRATZ_LABEL[SZKEY]||SZKEY}), учитываю только пары от ${fmt(settings.minGames)} игр.`);
  if (settings.rank === "pro") notes.push("На про-сцене мало игр, винрейты шумные. Для пабов лучше выбрать свой ранг.");
  notes.push(settings.hard ? `Герои с WR ниже 50% скрыты, кроме жёстких контрпиков (от ${settings.hardWr}% против врага).` : "Герои с WR ниже 50% скрыты.");
  $("#notes").innerHTML = `<details class="notes"><summary>Откуда данные и как считается</summary>${notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}</details>`;

  if (state.ours.length >= 5){
    $("#recs").innerHTML = state.enemy.length >= 5 ? renderAnalysis(ctx) : `<div class="empty-recs">Наша команда собрана. Итоги драфта появятся, когда добавишь всех 5 врагов.</div>`;
    return;
  }
  const taken = new Set(state.ours.map(x=>x.pos).filter(Boolean));
  const open = [1,2,3,4,5].filter(p=>!taken.has(p));
  const un = unavailable();
  const per = {}, best = {};
  ctx.threats = enemyThreats(ctx);
  {
    const byId = {};
    for (const x of likelyEnemyPicks(ctx)) byId[x.h.id] = {...x};
    for (const t of ctx.threats){ if (byId[t.h.id]) byId[t.h.id].w += t.w; else byId[t.h.id] = {h:t.h, p:t.p, w:t.w, s:0, threat:true}; }
    ctx.likely = Object.values(byId).sort((a,b)=>b.w-a.w);
    ctx.metaLikely = ctx.likely.filter(x=>!x.threat && !ctx.threats.some(t=>t.h.id===x.h.id));
  }
  for (const p of open){
    const pool = LIST.filter(h=>settings.offrole || posOf(h).includes(p));
    const tiers = tierMap(pool.map(h=>{ const m = metaFor(h,p,ctx); return m ? {id:h.id,pts:m.pts} : null; }).filter(Boolean));
    const arr = [];
    for (const h of pool){
      if (un.has(h.id)) continue;
      const r = score(h,p,ctx,tiers[h.id]); if (r) arr.push(r);
    }
    arr.sort((a,b)=>b.pts-a.pts);
    per[p] = arr;
    for (const r of arr) if (!best[r.h.id] || best[r.h.id].pts < r.pts) best[r.h.id] = r;
  }
  const top = Object.values(best).sort((a,b)=>b.pts-a.pts).slice(0,5);
  let html = `<div class="openpos">Свободные позиции: ${open.map(p=>`<b>${p}</b> ${POS_NAME[p]}`).join(" · ")}</div>`;
  html += `<h3>Лучший пик сейчас</h3>` + (top.length ? top.map(recCard).join("") : `<div class="empty-recs">Нет подходящих героев.</div>`);
  if (state.ours.length === 0 && open.length >= 2){
    const pairs = bestPairs(per, open, ctx);
    const keys = ["any"]; for (let i=0;i<open.length;i++) for (let j=i+1;j<open.length;j++) keys.push(open[i]+"-"+open[j]);
    const cur = keys.includes(state.pairPos) ? state.pairPos : "any";
    html += `<h3>Лучшие пары на двойной пик</h3><div class="pairpos">` + keys.map(k=>`<button class="${cur===k?"on":""}" data-act="pairpos" data-k="${k}">${k==="any"?"любые позиции":"поз. "+k.replace("-"," + ")}</button>`).join("") + `</div>`;
    html += pairs.length ? pairs.map(pairCard).join("") : `<div class="empty-recs">Нет подходящих пар.</div>`;
  }
  if (state.ours.length && ctx.sz){
    const syn = bestSynergy(per, open, ctx);
    const names = state.ours.map(x=>H[x.id]?H[x.id].name:"").filter(Boolean).join(", ");
    html += `<h3>Лучше всего сочетаются с: ${esc(names)}</h3>` + (syn.length ? syn.map(recCard).join("") : `<div class="empty-recs">Нет пар с ${fmt(settings.minGames)}+ играми.</div>`);
  }
  if (ctx.threats.length){
    html += `<h3>Опасные пики врага — контрят наших</h3>` + ctx.threats.map(t=>threatCard(t,ctx,open)).join("");
  } else if (state.ours.length && ctx.sz && state.enemy.length < 5){
    html += `<h3>Опасные пики врага — контрят наших</h3><div class="empty-recs">Явных контрпиков (от ${fmt(settings.threatMin)} игр, винрейт ниже 49%) не нашёл.</div>`;
  }
  if (ctx.metaLikely && ctx.metaLikely.length){
    html += `<h3>Популярные пики врага</h3><div class="likely">` + ctx.metaLikely.slice(0,6).map(x=>`<div class="lk">${pic(x.h)}<div><div>${esc(x.h.name)}</div><div class="small">поз. ${x.p}</div></div></div>`).join("") + `</div><div class="small">Советы учитывают, как герой стоит против опасных и популярных пиков врага.</div>`;
  }
  for (const p of open){
    html += `<h3>Позиция ${p} — ${POS_NAME[p]}</h3>`;
    const list = per[p].slice(0,settings.perPos);
    html += list.length ? list.map(recCard).join("") : `<div class="empty-recs">Нет героев с WR от 50% на эту позицию.</div>`;
  }
  $("#recs").innerHTML = html;
}

/* ---------- составы команд ---------- */
const ILLUSION = new Set(["phantom_lancer","naga_siren","terrorblade","chaos_knight","meepo","spectre"]);
const INVIS = new Set(["riki","clinkz","bounty_hunter","weaver","nyx_assassin","invoker","mirana","sand_king","treant","broodmother"]);
const HEAL = new Set(["necrolyte","huskar","alchemist","life_stealer","omniknight","oracle","dazzle","wisp","abaddon","chen"]);
const roles = h => (h.raw && h.raw.roles) || [];
const COMP = [
  {k:"ctrl",   name:"Контроль",          f:h=>roles(h).includes("Disabler")?1:(roles(h).includes("Initiator")?0.5:0)},
  {k:"magic",  name:"Магический урон",   f:h=>roles(h).includes("Nuker")?1:0},
  {k:"carry",  name:"Физ. урон (керри)", f:h=>roles(h).includes("Carry")?1:0},
  {k:"tank",   name:"Живучесть",         f:h=>roles(h).includes("Durable")?1:0},
  {k:"push",   name:"Пуш",               f:h=>(roles(h).includes("Pusher")||h.tags.includes("p"))?1:0},
  {k:"escape", name:"Мобильность",       f:h=>roles(h).includes("Escape")?1:0},
];
function teamComp(team){
  const out = {}; for (const c of COMP) out[c.k] = 0;
  for (const x of state[team]){ const h = H[x.id]; if (h) for (const c of COMP) out[c.k] += c.f(h); }
  return out;
}
function compHints(){
  const E = state.enemy.map(x=>H[x.id]).filter(Boolean), ec = teamComp("enemy"), oc = teamComp("ours");
  const names = set => E.filter(h=>set.has(h.short)).map(h=>h.name);
  const out = [];
  if (ec.magic >= 3) out.push(["bad","У врага много магического урона — пригодятся Pipe of Insight, Glimmer Cape, BKB."]);
  if (ec.ctrl >= 3.5) out.push(["bad","У врага много контроля — BKB, Linken's Sphere, Lotus Orb."]);
  const il = names(ILLUSION); if (il.length) out.push(["bad",`Иллюзии и клоны (${il.join(", ")}) — нужен урон по площади: Battle Fury, Mjollnir, герои с AoE.`]);
  const inv = names(INVIS); if (inv.length) out.push(["bad",`Невидимость (${inv.join(", ")}) — сентри, Dust of Appearance, Gem.`]);
  const hl = names(HEAL); if (hl.length) out.push(["bad",`Сильный хил и реген (${hl.join(", ")}) — Spirit Vessel, Shiva's Guard, Eye of Skadi.`]);
  if (ec.escape >= 3) out.push(["bad","Враги мобильные — нужен мгновенный контроль, Orchid или Nullifier."]);
  if (state.ours.length >= 3 && oc.ctrl < 1.5) out.push(["tag","У нас мало контроля — стоит взять героя с оглушением."]);
  if (state.ours.length >= 3 && oc.carry < 1) out.push(["tag","У нас нет явного керри — подумай, кто будет фармить на лейт."]);
  if (state.ours.length >= 4 && oc.push < 1) out.push(["tag","Нечем ломать башни — пригодится герой с пушем."]);
  return out;
}
function renderComposition(){
  if (!state.ours.length && !state.enemy.length) return "";
  const o = teamComp("ours"), e = teamComp("enemy");
  const dots = (v,c) => { let s = ""; for (let i=1;i<=5;i++) s += `<i class="${v>=i?c:(v>=i-0.5?c+" half":"")}"></i>`; return s; };
  let html = `<h3>Составы</h3><div class="comp"><div class="cr ch"><span></span><span>Мы</span><span>Враги</span></div>`;
  for (const c of COMP) html += `<div class="cr"><span class="cn">${c.name}</span><span class="dots">${dots(o[c.k],"o")}</span><span class="dots">${dots(e[c.k],"e")}</span></div>`;
  html += `</div>`;
  const hs = compHints();
  if (hs.length) html += hs.map(([k,t])=>`<div class="chint ${k}">${esc(t)}</div>`).join("") + `<div class="small" style="margin-top:6px">Предметы — общий ориентир, сверяй с текущим патчем.</div>`;
  return html;
}

/* ---------- вероятные пики врага ---------- */
// Кого враги, скорее всего, возьмут на свои свободные позиции:
// популярные сильные герои + синергия с их пиками + контра наших героев.
function likelyEnemyPicks(ctx){
  if (state.enemy.length >= 5) return [];
  const PE = ctx.enemyP, un = unavailable(), out = [];
  for (let p=1;p<=5;p++){
    const mass = Math.max(0, 1 - PE.reduce((s,x)=>s+x[p-1],0));
    if (mass < 0.25) continue;
    const arr = [];
    for (const h of LIST){
      if (un.has(h.id) || posProb(h)[p-1] < 0.15) continue;
      const m = metaFor(h,p,ctx); if (!m || m.wr < 49) continue;
      const base = ctx.st[h.id] ? ctx.st[h.id].wr : 50;
      let s = m.pts;
      if (ctx.sz){
        for (const e of state.enemy){ const pr = pair(h.id,e.id,"w"); if (pr && pr.m >= settings.minGames) s += (pr.wr-base)*0.6; }
        for (const o of state.ours){ const pr = pair(h.id,o.id,"v"); if (pr && pr.m >= settings.minGames) s += (pr.wr-base)*0.4; }
      }
      arr.push({h,p,s});
    }
    arr.sort((a,b)=>b.s-a.s);
    arr.slice(0,3).forEach((x,i)=>out.push({...x, w:mass/(i+1)}));
  }
  const best = {};
  for (const x of out) if (!best[x.h.id] || best[x.h.id].w < x.w) best[x.h.id] = x;
  return Object.values(best).sort((a,b)=>b.w-a.w || b.s-a.s);
}

/* ---------- опасные пики врага: контрпики наших героев ---------- */
// Герои, против которых у наших уже взятых героев винрейт ниже 49% на выборке от settings.threatMin игр,
// и которые реально играют на одной из позиций, ещё свободных у врага.
function enemyThreats(ctx){
  if (!ctx.sz || !state.ours.length || state.enemy.length >= 5) return [];
  const PE = ctx.enemyP, un = unavailable();
  const openMass = [1,2,3,4,5].map(p=>Math.max(0, 1 - PE.reduce((s,x)=>s+x[p-1],0)));
  const out = [];
  for (const h of LIST){
    if (un.has(h.id)) continue;
    const pp = posProb(h);
    let bestP = 0, bestQ = 0;
    for (let p=1;p<=5;p++){
      if (pp[p-1] < 0.1 || openMass[p-1] < 0.25) continue;
      const q = pp[p-1]*openMass[p-1];
      if (q > bestQ){ bestQ = q; bestP = p; }
    }
    if (!bestP) continue;
    const hits = [];
    for (const o of state.ours){
      const pr = pair(o.id, h.id, "v"); // винрейт НАШЕГО героя против этого
      if (pr && pr.m >= settings.threatMin && pr.wr < 49) hits.push({n:H[o.id]?H[o.id].name:"?", wr:pr.wr, m:pr.m});
    }
    if (!hits.length) continue;
    const sev = hits.reduce((s,x)=>s+(50-x.wr),0);
    out.push({h, p:bestP, sev, hits, w:Math.min(1,bestQ*2)*sev/3});
  }
  return out.sort((a,b)=>b.sev-a.sev).slice(0,8);
}
function threatCard(t, ctx, open){
  const chips = t.hits.sort((a,b)=>a.wr-b.wr).map(x=>`<span class="chip bad">${esc(x.n)} выигрывает только ${x.wr.toFixed(1)}% (${fmt(x.m)} игр)</span>`);
  const mine = open.find(p=>posOf(t.h).includes(p) && (()=>{ const m = metaFor(t.h,p,ctx); return m && m.wr >= 50; })());
  if (mine) chips.push(`<span class="chip good">можно забрать себе на поз. ${mine}</span>`);
  return `<div class="rec threat">${pic(t.h)}<div class="body"><div class="top"><span class="rn">${esc(t.h.name)}</span><span class="rp">у врага обычно поз. ${t.p}</span></div><div class="chips">${chips.join("")}</div></div></div>`;
}

/* ---------- пары на двойной пик ---------- */
function bestPairs(per, open, ctx){
  if (open.length < 2) return [];
  let sel = state.pairPos && state.pairPos !== "any" ? state.pairPos.split("-").map(Number) : null;
  if (sel && !(open.includes(sel[0]) && open.includes(sel[1]))) sel = null;
  const combos = [];
  if (sel) combos.push(sel);
  else for (let i=0;i<open.length;i++) for (let j=i+1;j<open.length;j++) combos.push([open[i],open[j]]);
  const out = [];
  for (const [p,q] of combos){
    for (const a of per[p].slice(0,15)) for (const b of per[q].slice(0,15)){
      if (a.h.id === b.h.id) continue;
      let s = a.pts + b.pts, syn = null;
      if (ctx.sz){
        const pr = pair(a.h.id,b.h.id,"w");
        if (pr && pr.m >= settings.minGames){ syn = pr.wr - (ctx.st[a.h.id].wr + ctx.st[b.h.id].wr - 50); s += syn; }
      }
      out.push({a,b,s,syn});
    }
  }
  out.sort((x,y)=>y.s-x.s);
  const res = [], cnt = {};
  for (const x of out){
    if ((cnt[x.a.h.id]||0) >= 2 || (cnt[x.b.h.id]||0) >= 2) continue;
    res.push(x); cnt[x.a.h.id] = (cnt[x.a.h.id]||0)+1; cnt[x.b.h.id] = (cnt[x.b.h.id]||0)+1;
    if (res.length >= 5) break;
  }
  return res;
}
// Кандидаты, у которых лучшая синергия с уже взятыми нашими героями (с учётом меты на своей позиции).
function bestSynergy(per, open, ctx){
  const best = {};
  for (const p of open) for (const r of per[p]){
    let syn = 0, n = 0;
    for (const a of state.ours){
      const pr = pair(r.h.id, a.id, "w"); if (!pr || pr.m < settings.minGames) continue;
      syn += pr.wr - (ctx.st[r.h.id].wr + (ctx.st[a.id] ? ctx.st[a.id].wr : 50) - 50); n++;
    }
    if (!n || syn <= 0) continue;
    const v = syn*1.5 + r.pts*0.3;
    if (!best[r.h.id] || best[r.h.id].v < v) best[r.h.id] = {...r, v, synSum:syn};
  }
  return Object.values(best).sort((a,b)=>b.v-a.v).slice(0,5);
}

function pairCard(x){
  const one = r => `<div class="pp">${pic(r.h)}<div class="pc"><div>${tierBadge(r.tier)}<b>${esc(r.h.name)}</b></div><div class="small">поз. ${r.p} · WR ${r.wr.toFixed(1)}%</div></div></div>`;
  const syn = x.syn == null ? `<span class="chip">синергия: мало игр</span>` : `<span class="chip ${x.syn>=1?"good":x.syn<=-1?"bad":""}">синергия пары ${x.syn>=0?"+":""}${x.syn.toFixed(1)}%</span>`;
  return `<button class="rec pair" data-act="pickpair" data-a="${x.a.h.id}" data-pa="${x.a.p}" data-b="${x.b.h.id}" data-pb="${x.b.p}" title="Нажми, чтобы взять обоих">${one(x.a)}<div class="plus">+</div>${one(x.b)}<div class="psc"><span class="sc">${x.s>=0?"+":""}${x.s.toFixed(1)}</span>${syn}</div></button>`;
}

/* ---------- позиции как вероятности ---------- */
// Распределение позиций героя: из STRATZ за выбранный период, иначе из таблицы.
function posProb(h){
  const arr = SP && SP.heroes && SP.heroes[h.id];
  if (arr){
    const t = arr.reduce((s,x)=>s+(x?x[0]:0),0);
    if (t >= 100) return [0,1,2,3,4].map(i=>(arr[i]?arr[i][0]:0)/t);
  }
  const ps = h.pos || [], out = [0,0,0,0,0];
  if (!ps.length) return [.2,.2,.2,.2,.2];
  if (ps.length === 1){ out[ps[0]-1] = 1; return out; }
  out[ps[0]-1] = 0.6;
  for (const p of ps.slice(1)) out[p-1] += 0.4/(ps.length-1);
  return out;
}
// Вероятности позиций для всей команды: выставленные вручную позиции — точно,
// остальные — по статистике, без «двух мидеров» в одной команде.
function teamProbs(team){
  const list = state[team];
  const fixed = new Set(list.map(x=>x.pos).filter(Boolean));
  const P = list.map(x=>{
    if (x.pos) return [1,2,3,4,5].map(p=>p===x.pos?1:0);
    const h = H[x.id]; if (!h) return [0,0,0,0,0];
    const v = posProb(h).map((q,i)=>fixed.has(i+1)?0:q);
    const s = v.reduce((a,b)=>a+b,0);
    return s ? v.map(q=>q/s) : v;
  });
  for (let i=0;i<5;i++){
    if (fixed.has(i+1)) continue;
    const s = P.reduce((a,x,k)=>a+(list[k].pos?0:x[i]),0);
    if (s > 1) P.forEach((x,k)=>{ if (!list[k].pos) x[i] /= s; });
  }
  return P;
}

/* ---------- итоги драфта ---------- */
const L = p => { const q = Math.min(0.99, Math.max(0.01, p)); return Math.log(q/(1-q)); };
const SIG = x => 1/(1+Math.exp(-x));

function laneStat(a, b){
  if (!LN || !LN.heroes) return null;
  // считаем только матчи, где исход линии известен (победа + ничья + поражение)
  let x = LN.heroes[a] && LN.heroes[a][b];
  if (x){ const t = x[1]+x[2]+x[3]; if (t) return {m:t, wr:(x[1]+x[2]/2)/t*100}; }
  x = LN.heroes[b] && LN.heroes[b][a];
  if (x){ const t = x[1]+x[2]+x[3]; if (t) return {m:t, wr:(x[3]+x[2]/2)/t*100}; }
  return null;
}

// Сумма вкладов героев в «логит» переоценивает силу драфта (игроки решают больше, чем пики),
// поэтому сжимаем: на реальных данных случайные драфты дают примерно 40–60%.
const DRAFT_K = 0.45;

function analyzeDraft(ctx){
  const wr = id => (ctx.st[id] && ctx.st[id].p ? ctx.st[id].wr : 50)/100;
  const O = state.ours.map(x=>x.id), E = state.enemy.map(x=>x.id);
  const PO0 = teamProbs("ours"), PE0 = teamProbs("enemy");
  // винрейт героя с учётом позиции: средний по позициям, взвешенный вероятностью (у наших позиция обычно точная)
  const wrPos = (id, P) => {
    const arr = ctx.sp && SP.heroes[id];
    if (!arr) return wr(id);
    let s = 0, q = 0;
    P.forEach((pq,i)=>{ const x = arr[i]; if (pq > 0 && x && x[0] >= settings.minGames){ s += pq*x[1]/x[0]; q += pq; } });
    return q >= 0.5 ? s/q : wr(id);
  };
  let meta = 0;
  O.forEach((a,i)=>{ meta += L(wrPos(a, PO0[i])); });
  E.forEach((b,i)=>{ meta -= L(wrPos(b, PE0[i])); });
  let syn = 0, ctr = 0, synN = 0, ctrN = 0;
  if (ctx.sz){
    const team = (T, sign) => {
      for (let i=0;i<T.length;i++) for (let j=i+1;j<T.length;j++){
        const pr = pair(T[i],T[j],"w"); if (!pr || pr.m < settings.minGames) continue;
        syn += sign * 0.5 * (L(pr.wr/100) - L(wr(T[i])) - L(wr(T[j]))); synN++;
      }
    };
    team(O,1); team(E,-1);
    for (const a of O) for (const b of E){
      const pr = pair(a,b,"v"); if (!pr || pr.m < settings.minGames) continue;
      ctr += 0.5 * (L(pr.wr/100) - L(wr(a)) + L(wr(b))); ctrN++;
    }
  }
  const pp = x => (SIG(DRAFT_K*x)-0.5)*100;
  const res = {win:SIG(DRAFT_K*(meta+syn+ctr))*100, parts:{meta:pp(meta), syn:pp(syn), ctr:pp(ctr)}, synN, ctrN};

  // линии: наша лёгкая (1+5) против их сложной (3+4), мид против мида, наша сложная (3+4) против их лёгкой (1+5)
  const PO = teamProbs("ours"), PE = teamProbs("enemy");
  const lanes = [
    {name:"Лёгкая линия", our:[1,5], their:[3,4]},
    {name:"Мид", our:[2], their:[2]},
    {name:"Сложная линия", our:[3,4], their:[1,5]},
  ];
  res.lanes = lanes.map(ln=>{
    const inLane = (P,k,set) => set.reduce((s,p)=>s+P[k][p-1],0);
    const who = (team, P, set) => {
      const all = state[team].map((x,k)=>({n:H[x.id]?H[x.id].name:"?", q:inLane(P,k,set)})).sort((a,b)=>b.q-a.q);
      const sure = all.filter(x=>x.q>=0.3);
      return (sure.length ? sure : all.slice(0,1)).map(x=>x.q>=0.95?x.n:`${x.n} (${Math.round(x.q*100)}%)`);
    };
    let sw = 0, sv = 0;
    if (LN){
      state.ours.forEach((a,i)=>{ const qa = inLane(PO,i,ln.our); if (qa < 0.05) return;
        state.enemy.forEach((b,j)=>{ const qb = inLane(PE,j,ln.their); if (qb < 0.05) return;
          const s = laneStat(a.id,b.id); if (!s || s.m < 50) return;
          sw += qa*qb; sv += qa*qb*s.wr; });
      });
    }
    return {name:ln.name, ours:who("ours",PO,ln.our), theirs:who("enemy",PE,ln.their), val: sw >= 0.3 ? sv/sw : null};
  });

  // стадии игры: STRATZ даёт для каждой минуты t, сколько матчей героя дожило до неё и сколько из них выиграно.
  // Разница между минутами = матчи, закончившиеся в этом промежутке.
  res.phases = [];
  if (TD && TD.format === "minutes" && Array.isArray(TD.minutes) && TD.minutes.length > 2){
    const mins = TD.minutes, last = mins.length-1;
    const at = t => { let i = mins.findIndex(m=>m>=t); return i < 0 ? last : i; };
    const i0 = 0, i25 = at(25), iL = last;
    const tail = mins[iL];
    const seg = (id, from, to) => {
      const arr = TD.heroes[id]; if (!arr) return null;
      const A = arr[from], B = to == null ? [0,0] : arr[to];
      const m = A[0]-B[0], w = A[1]-B[1];
      return m >= 100 ? w/m : null;
    };
    const phase = (from, to) => {
      let s = 0, n = 0;
      const w = id => { const v = seg(id, from, to); if (v != null){ n++; return v; } return wr(id); };
      for (const a of O) s += L(w(a));
      for (const b of E) s -= L(w(b));
      return n >= 5 ? SIG(DRAFT_K*s)*100 : null;
    };
    res.phases.push({name:`Короткая игра (до ${mins[i25]} мин)`, val:phase(i0, i25)});
    res.phases.push({name:`Мид-гейм (${mins[i25]}–${tail} мин)`, val:phase(i25, iL)});
    res.phases.push({name:`Долгая игра (${tail}+ мин)`, val:phase(iL, null)});
  } else {
    res.phases.push({name:"Короткая игра", val:null},{name:"Мид-гейм", val:null},{name:"Долгая игра", val:null});
  }
  return res;
}

function anRow(title, val, sub){
  if (val == null) return `<div class="an-row"><div class="an-head"><span>${esc(title)}</span><span class="small">нет данных</span></div>${sub||""}</div>`;
  const o = Math.round(val), d = val - 50;
  const verdict = Math.abs(d) < 1.5 ? `<span class="small">примерно равно</span>` : d > 0 ? `<b class="good">Мы лучше</b>` : `<b class="bad">Враги лучше</b>`;
  return `<div class="an-row"><div class="an-head"><span>${esc(title)}</span>${verdict}</div><div class="bar"><div class="bo" style="width:${clamp(o,8,92)}%">Мы ${o}%</div><div class="be" style="width:${clamp(100-o,8,92)}%">${100-o}%</div></div>${sub||""}</div>`;
}

function renderAnalysis(ctx){
  const a = analyzeDraft(ctx);
  const f = x => `${x>=0?"+":""}${x.toFixed(1)}%`;
  let html = `<div class="an"><h3>Итоги драфта</h3>`;
  const parts = [`<span class="chip">мета ${f(a.parts.meta)}</span>`];
  if (ctx.sz){ parts.push(`<span class="chip">синергия ${f(a.parts.syn)}</span>`, `<span class="chip">контрпики ${f(a.parts.ctr)}</span>`); }
  html += anRow("Драфт в целом (шанс на победу)", a.win, `<div class="chips">${parts.join("")}</div>`);
  for (const ln of a.lanes){
    const sub = `<div class="small an-sub">${esc(ln.ours.join(", ")||"—")} <span class="vs">против</span> ${esc(ln.theirs.join(", ")||"—")}</div>`;
    html += anRow(ln.name, ln.val, sub);
  }
  for (const ph of a.phases) html += anRow(ph.name, ph.val);
  const notes = [];
  if (!ctx.sz) notes.push("без контрпиков и синергии — нет данных STRATZ");
  if (!LN) notes.push("линии появятся после обновления данных STRATZ");
  if (!TD) notes.push("стадии игры появятся после обновления данных STRATZ");
  notes.push("это оценка по статистике, а не гарантия: игру решают игроки");
  html += `<div class="small an-note">${esc(notes.join(" · "))}</div></div>`;
  return html;
}

function renderStatus(){
  const parts = [];
  if (heroStatsMeta){
    const d = new Date(heroStatsMeta.t);
    parts.push(`OpenDota: <b>${d.toLocaleDateString("ru-RU")} ${d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</b>`);
    if (heroStatsMeta.stale) parts.push(`<span class="warn">не удалось обновить, показываю сохранённые данные</span>`);
  }
  const szu = (SZ && SZ.updated) || (SD && SD.updated);
  if (szu) parts.push(`STRATZ: <b>${new Date(szu).toLocaleDateString("ru-RU")}</b>`);
  else parts.push(`STRATZ: <b>нет данных</b>`);
  parts.push(`Ранг: <b>${RANKS.find(r=>r[0]===settings.rank)[1]}</b>`);
  $("#status").innerHTML = parts.join(" · ");
}

function renderCompCard(){
  const html = LIST.length ? renderComposition() : "";
  const el = $("#compCard"); el.hidden = !html; el.innerHTML = html;
}

function renderAll(){
  renderCompCard();
  renderSlots("ours"); renderSlots("enemy"); renderBans(); renderModes(); renderGrid(); renderRecs(); renderStatus();
}

/* ---------- данные ---------- */
async function loadHeroStats(force){
  const cached = LS.get("hs",null);
  if (!force && cached && Date.now()-cached.t < 6*3600e3) return cached;
  try {
    const r = await fetch(OPENDOTA);
    if (!r.ok) throw new Error("HTTP "+r.status);
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) throw new Error("пустой ответ");
    const v = {t:Date.now(),data};
    LS.set("hs",v);
    return v;
  } catch(e){
    if (cached) { cached.stale = true; return cached; }
    throw e;
  }
}

// Складывает дневную статистику STRATZ за выбранный период.
// Слот 0 — все позиции, 1..5 — конкретная позиция.
function buildPeriod(){
  PST = null; SP = null;
  if (SD && SD.heroes && Array.isArray(SD.days) && SD.days.length){
    let idx;
    if (settings.period === "patch"){
      const t = Date.parse((settings.patchDate||DEFAULTS.patchDate)+"T00:00:00Z")/1000;
      idx = SD.days.map((d,i)=>d>=t?i:-1).filter(i=>i>=0);
    } else {
      idx = SD.days.map((d,i)=>[d,i]).sort((a,b)=>b[0]-a[0]).slice(0,+settings.period||7).map(x=>x[1]);
    }
    let fallback = false;
    if (!idx.length){ // например, «С начала патча», а STRATZ ещё не выложил дни нового патча
      idx = SD.days.map((d,i)=>[d,i]).sort((a,b)=>b[0]-a[0]).slice(0,7).map(x=>x[1]);
      fallback = true;
    }
    if (idx.length){
      const all = {}, pos = {};
      for (const id in SD.heroes){
        const slots = SD.heroes[id];
        const sum = s => { let m=0,w=0; const arr = slots[s]||[]; for (const i of idx){ const x = arr[i]; if (x){ m+=x[0]; w+=x[1]; } } return [m,w]; };
        all[id] = sum(0); pos[id] = [1,2,3,4,5].map(sum);
      }
      const ds = idx.map(i=>SD.days[i]);
      PST = {all,n:idx.length,from:Math.min(...ds),to:Math.max(...ds),fallback};
      SP = {heroes:pos,updated:SD.updated};
    }
  }
  applyPositions();
}

async function fetchJson(url){
  try { const r = await fetch(url,{cache:"no-cache"}); if (r.ok) return await r.json(); } catch(e){}
  return null;
}
async function loadStratz(){
  const key = STRATZ_BRACKET[settings.rank] || "ALL";
  const base = (settings.dataUrl||"data").replace(/\/+$/,"");
  const ck = base+"|"+key;
  if (!(ck in szCache)){
    const [m,d,l,t] = await Promise.all(["matchups","daily","lane","time"].map(n=>fetchJson(`${base}/${n}-${key}.json`)));
    szCache[ck] = {m:m&&m.heroes?m:null, d:d&&d.heroes?d:null, l:l&&l.heroes?l:null, t:t&&t.heroes?t:null};
  }
  SZ = szCache[ck].m; SD = szCache[ck].d; LN = szCache[ck].l; TD = szCache[ck].t; SZKEY = key;
  buildPeriod();
}

async function init(force){
  $("#status").textContent = "Загрузка данных…";
  try {
    heroStatsMeta = await loadHeroStats(force);
    buildHeroes(heroStatsMeta.data);
  } catch(e){
    $("#recs").innerHTML = `<div class="err">Не удалось скачать статистику с OpenDota (${esc(e.message||e)}).<br>Проверь интернет и нажми «Обновить данные».</div>`;
    $("#status").textContent = "Нет данных";
    return;
  }
  await loadStratz();
  state.ours = state.ours.filter(x=>H[x.id]); state.enemy = state.enemy.filter(x=>H[x.id]); state.bans = state.bans.filter(id=>H[id]);
  renderAll();
}

/* ---------- настройки ---------- */
function fillSettings(){
  $("#setRank").innerHTML = RANKS.map(([v,t])=>`<option value="${v}">${t}</option>`).join("");
  $("#setRank").value = settings.rank;
  $("#setMinGames").value = settings.minGames;
  $("#setThreatMin").value = settings.threatMin;
  $("#setHard").checked = settings.hard;
  $("#setHardWr").value = settings.hardWr;
  $("#setOffrole").checked = settings.offrole;
  $("#setPerPos").value = settings.perPos;
  $("#setDataUrl").value = settings.dataUrl;
  $("#setPeriod").value = settings.period;
  $("#setPatchDate").value = settings.patchDate;
  document.querySelectorAll("[data-tag]").forEach(c=>c.checked=!!settings.tags[c.dataset.tag]);
}
async function onSettings(){
  const oldRank = settings.rank, oldUrl = settings.dataUrl;
  settings.rank = $("#setRank").value;
  settings.minGames = Math.max(1, +$("#setMinGames").value || DEFAULTS.minGames);
  settings.threatMin = Math.max(50, +$("#setThreatMin").value || DEFAULTS.threatMin);
  settings.hard = $("#setHard").checked;
  settings.hardWr = clamp(+$("#setHardWr").value || DEFAULTS.hardWr, 50, 80);
  settings.offrole = $("#setOffrole").checked;
  settings.perPos = clamp(Math.round(+$("#setPerPos").value || DEFAULTS.perPos), 1, 10);
  settings.dataUrl = $("#setDataUrl").value.trim() || "data";
  settings.period = $("#setPeriod").value;
  settings.patchDate = $("#setPatchDate").value || DEFAULTS.patchDate;
  document.querySelectorAll("[data-tag]").forEach(c=>settings.tags[c.dataset.tag]=c.checked);
  save();
  buildPeriod();
  renderAll();
  if (oldRank !== settings.rank || oldUrl !== settings.dataUrl){ await loadStratz(); renderAll(); }
}

/* ---------- события ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "add") { addHero(+b.dataset.id, state.mode); $("#search").value=""; renderGrid(); $("#search").focus(); }
  else if (act === "pick") addHero(+b.dataset.id, "ours", +b.dataset.p);
  else if (act === "rm") removeHero(b.dataset.team, +b.dataset.i);
  else if (act === "pos") setPos(b.dataset.team, +b.dataset.i, +b.dataset.p);
  else if (act === "pairpos"){ state.pairPos = b.dataset.k; save(); renderRecs(); }
  else if (act === "pickpair"){ addHero(+b.dataset.a, "ours", +b.dataset.pa); addHero(+b.dataset.b, "ours", +b.dataset.pb); }
});
$("#modes").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  state.mode = b.dataset.mode; save(); renderModes(); $("#search").focus();
});
$("#search").addEventListener("input", renderGrid);
$("#search").addEventListener("keydown", e=>{
  if (e.key === "Enter"){
    const un = unavailable();
    const h = filtered().find(x=>!un.has(x.id));
    if (h && $("#search").value.trim()){ addHero(h.id, state.mode); $("#search").value=""; renderGrid(); }
  } else if (e.key === "Escape"){ $("#search").value=""; renderGrid(); }
});
$("#btnSettings").addEventListener("click", ()=>{ const s=$("#settings"); s.hidden=!s.hidden; });
$("#settings").addEventListener("change", onSettings);
$("#btnRefresh").addEventListener("click", ()=>{ for (const k in szCache) delete szCache[k]; init(true); });
$("#btnNew").addEventListener("click", ()=>{ state.ours=[]; state.enemy=[]; state.bans=[]; state.mode="ours"; save(); renderAll(); $("#search").focus(); });

fillSettings();
init(false);
</script>
